name: AI Auto-Video Alarm

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ১০টায় (UTC ভোর ৪টায়) অ্যালার্ম বাজবে
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-ai-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Video Automation Engine
        run: python main.py
        
